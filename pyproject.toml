[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-qa-engineer"
version = "0.1.0"
description = "Deterministic HTTP crawling, test generation, execution, and bug reporting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Autonomous QA Engineer contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aqe = "aqe.cli:main"

[tool.setuptools.packages.find]
include = ["aqe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
